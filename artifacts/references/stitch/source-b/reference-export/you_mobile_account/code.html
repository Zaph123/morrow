<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You — Mobile — Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
          },
          colors: {
            workspace: '#F5F5F7',
            charcoal: '#121316',
            secondary: '#5E636E',
            borderSubtle: '#E5E6EB',
            neutralBtn: '#ECECEF',
            neutralBtnHover: '#E2E2E6',
            disabledText: '#8E94A0',
            limeAccent: '#D4FC30',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #F5F5F7;
      color: #121316;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }
    .touch-target {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-workspace text-charcoal min-h-screen flex flex-col items-center">
  <!-- Mobile screen container (390px fixed width target) -->
  <div class="w-full max-w-[390px] min-h-[844px] bg-workspace relative flex flex-col pb-36">

    <!-- Top Header Bar -->
    <header class="pt-12 px-6 pb-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="#" class="touch-target -ml-2 text-charcoal rounded-full hover:bg-neutralBtn/60 transition-colors" aria-label="Back to Home">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <h1 class="text-[24px] leading-[32px] font-semibold tracking-tight text-charcoal">You</h1>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="px-6 flex-1 flex flex-col">

      <!-- Cover & Avatar Shared Section -->
      <section class="mt-2 mb-6">
        <!-- Cover Wrapper (relative, overflow visible) -->
        <div class="relative w-full h-[112px]">
          <!-- Inner gradient banner surface -->
          <div class="w-full h-full rounded-[16px] overflow-hidden bg-gradient-to-r from-[#D7F5DE] via-[#E4F3E2] to-[#FCE0D4] relative border border-borderSubtle/60">
            <button class="absolute top-3 right-3 touch-target h-8 px-3 rounded-full bg-white/80 hover:bg-white text-[12px] font-medium text-charcoal shadow-sm backdrop-blur-sm transition-all" aria-label="Add cover">
              <svg class="w-3.5 h-3.5 mr-1.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              Add cover
            </button>
          </div>

          <!-- Avatar (absolute, top 100%, translateY(-50%), 96px diameter, 12px inset from left) -->
          <div class="absolute top-full left-[12px] -translate-y-1/2 w-[96px] h-[96px] rounded-full border-4 border-white bg-neutralBtn flex items-center justify-center shadow-sm select-none z-10">
            <span class="text-[34px] font-medium text-charcoal">Z</span>
            <!-- Camera affordance (at least 44px interactive target) -->
            <button class="touch-target absolute -bottom-1 -right-1 w-11 h-11 rounded-full bg-white border border-borderSubtle text-charcoal shadow-sm hover:bg-neutralBtn transition-all" aria-label="Change profile picture">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Name & Supporting Text Block (begins 8px below cover, offset 124px = 12px inset + 96px avatar + 16px gap) -->
        <div class="min-h-[56px] pt-2 pl-[124px]">
          <h2 class="text-[18px] leading-[24px] font-semibold text-charcoal">Zaphenath</h2>
          <p class="text-[13px] leading-[18px] text-secondary mt-1">Your profile and account settings.</p>
        </div>
      </section>

      <!-- Tabs (Profile inactive / Account selected) -->
      <nav class="flex items-center border-b border-borderSubtle mb-6" aria-label="Profile Sections">
        <a href="#" class="touch-target pb-3 text-[15px] font-medium text-secondary hover:text-charcoal transition-colors relative" aria-selected="false">
          Profile
        </a>
        <a href="#" class="touch-target pb-3 ml-6 text-[15px] font-semibold text-charcoal relative" aria-selected="true">
          Account
          <!-- Charcoal active underline -->
          <span class="absolute bottom-0 left-0 right-0 h-[2px] bg-charcoal rounded-full"></span>
        </a>
      </nav>

      <!-- Account Settings Sections (3 flat sections with subtle dividers & 24px spacing) -->
      <div class="space-y-6">

        <!-- SECTION 1: Email Address -->
        <section class="space-y-2">
          <div>
            <h3 class="text-[15px] leading-[20px] font-medium text-charcoal">Email address</h3>
            <p class="text-[13px] leading-[18px] text-secondary mt-0.5">The email you use to sign in.</p>
          </div>
          <div class="flex items-center justify-between gap-3 pt-1">
            <span class="text-[14px] leading-[20px] font-normal text-charcoal break-all select-all">zaphenath@example.com</span>
            <button type="button" class="touch-target h-[44px] px-4 rounded-[12px] bg-neutralBtn hover:bg-neutralBtnHover text-[14px] font-medium text-charcoal transition-colors flex-shrink-0">
              Change email
            </button>
          </div>
        </section>

        <hr class="border-t border-borderSubtle">

        <!-- SECTION 2: Password -->
        <section class="space-y-2">
          <div>
            <h3 class="text-[15px] leading-[20px] font-medium text-charcoal">Password</h3>
            <p class="text-[13px] leading-[18px] text-secondary mt-0.5">Manage your sign-in password.</p>
          </div>
          <div class="flex items-center justify-between gap-3 pt-1">
            <div class="flex items-center gap-1.5 text-charcoal">
              <svg class="w-4 h-4 text-secondary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span class="text-[14px] leading-[20px] font-normal">Password set</span>
            </div>
            <button type="button" class="touch-target h-[44px] px-4 rounded-[12px] bg-neutralBtn hover:bg-neutralBtnHover text-[14px] font-medium text-charcoal transition-colors flex-shrink-0">
              Change password
            </button>
          </div>
        </section>

        <hr class="border-t border-borderSubtle">

        <!-- SECTION 3: Google -->
        <section class="space-y-2">
          <div>
            <h3 class="text-[15px] leading-[20px] font-medium text-charcoal">Google</h3>
            <p class="text-[13px] leading-[18px] text-secondary mt-0.5">Another way to sign in to this account.</p>
          </div>
          <div class="flex items-center justify-between gap-3 pt-1">
            <span class="text-[14px] leading-[20px] font-normal text-secondary">Not connected</span>
            <button type="button" class="touch-target h-[44px] px-4 rounded-[12px] bg-neutralBtn hover:bg-neutralBtnHover text-[14px] font-medium text-charcoal transition-colors flex-shrink-0">
              Connect Google
            </button>
          </div>
        </section>

        <hr class="border-t border-borderSubtle">

        <!-- Sign Out Action -->
        <div class="pt-2">
          <button type="button" class="touch-target h-[44px] px-5 rounded-[12px] bg-neutralBtn hover:bg-neutralBtnHover text-[14px] font-medium text-charcoal transition-colors">
            Sign out
          </button>
        </div>

      </div>

    </main>

    <!-- Floating Navigation Bar (Capsule) with Selected Brand Brain -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[342px] h-14 bg-charcoal rounded-full flex items-center justify-between px-2 shadow-lg z-30" aria-label="Main Navigation">
      <!-- Home -->
      <a href="#" class="touch-target w-11 h-11 rounded-full text-white/70 hover:text-white transition-colors" aria-label="Home">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>

      <!-- Studio -->
      <a href="#" class="touch-target w-11 h-11 rounded-full text-white/70 hover:text-white transition-colors" aria-label="Studio">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m18 2 4 4-14 14H4v-4L18 2z"></path>
        </svg>
      </a>

      <!-- Library -->
      <a href="#" class="touch-target w-11 h-11 rounded-full text-white/70 hover:text-white transition-colors" aria-label="Library">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="M6 6h10"></path>
          <path d="M6 10h10"></path>
        </svg>
      </a>

      <!-- Ideas -->
      <a href="#" class="touch-target w-11 h-11 rounded-full text-white/70 hover:text-white transition-colors" aria-label="Ideas">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
          <path d="M9 18h6"></path>
          <path d="M10 22h4"></path>
        </svg>
      </a>

      <!-- Brand Brain (Selected inner pill #2F3132) -->
      <a href="#" class="touch-target h-11 px-3.5 bg-[#2F3132] text-white rounded-full flex items-center gap-1.5 text-[12px] font-medium transition-colors" aria-label="Brand Brain" aria-current="page">
        <!-- Exact Brain SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
          <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
          <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
          <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
          <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
          <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
          <path d="M6 18a4 4 0 0 1-1.967-.516"/>
          <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
        </svg>
        <span>Brand Brain</span>
      </a>
    </nav>

  </div>
</body>
</html>
