<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component — Desktop — Sidebar — You active</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              lime: '#D4FC30',
              'lime-light': '#F2FCD6',
              charcoal: '#121316',
              secondary: '#5E636E',
              border: '#E5E6EB',
              neutral: '#ECECEF',
              error: '#BA1A1A',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #F5F5F7;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .focus-ring:focus-visible {
      outline: 2px solid #536600;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#F5F5F7] flex">

  <!-- Authoritative Desktop Sidebar Component -->
  <aside 
    id="authoritative-desktop-sidebar" 
    class="w-[240px] h-[1024px] bg-[#FFFFFF] border-r border-[#E5E6EB] px-6 py-6 flex flex-col justify-between shrink-0 select-none box-border"
    aria-label="Main Navigation"
  >
    <!-- Top & Main Navigation -->
    <div class="flex flex-col w-full">
      
      <!-- Top Group: Neutral New Idea Button -->
      <button 
        type="button" 
        class="w-full min-h-[44px] bg-[#ECECEF] text-[#121316] hover:bg-[#E2E2E6] active:bg-[#D9DADC] transition-colors rounded-[12px] flex items-center justify-center gap-2 px-4 text-[15px] leading-[20px] font-medium focus-ring"
        aria-label="New idea"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New idea</span>
      </button>

      <!-- Spacing: 32px between New idea and main navigation -->
      <div class="h-8" aria-hidden="true"></div>

      <!-- Main Navigation Items -->
      <nav class="flex flex-col gap-1 w-full" aria-label="Workspaces">
        <!-- Home -->
        <a 
          href="#home" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="truncate">Home</span>
        </a>

        <!-- Studio -->
        <a 
          href="#studio" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span class="truncate">Studio</span>
        </a>

        <!-- Library -->
        <a 
          href="#library" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <rect x="9" y="4" width="6" height="16"></rect>
            <line x1="9" y1="9" x2="9" y2="9.01"></line>
            <line x1="15" y1="9" x2="15" y2="9.01"></line>
          </svg>
          <span class="truncate">Library</span>
        </a>

        <!-- Ideas -->
        <a 
          href="#ideas" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
            <path d="M9 18h6"></path>
            <path d="M10 22h4"></path>
          </svg>
          <span class="truncate">Ideas</span>
        </a>

        <!-- Brand Brain (Exact Verbatim SVG path) -->
        <a 
          href="#brand-brain" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
            <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
            <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
            <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
            <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
            <path d="M6 18a4 4 0 0 1-1.967-.516"/>
            <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
          </svg>
          <span class="truncate">Brand Brain</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Group: Calendar, You (Active), Divider, Sign Out -->
    <div class="flex flex-col w-full pb-0">
      
      <!-- Nav items: Calendar and You -->
      <div class="flex flex-col gap-1 w-full" aria-label="Personal Navigation">
        <!-- Calendar -->
        <a 
          href="#calendar" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] text-[#5E636E] hover:text-[#121316] hover:bg-[#F5F5F7] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-current" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="truncate">Calendar</span>
        </a>

        <!-- You (SELECTED: #F2FCD6 fill, #121316 text and icon) -->
        <a 
          href="#you" 
          class="flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] bg-[#F2FCD6] text-[#121316] transition-colors text-[15px] leading-[20px] font-medium focus-ring"
          aria-current="page"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[#121316]" aria-hidden="true">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="truncate">You</span>
        </a>
      </div>

      <!-- Spacing: 16px before divider -->
      <div class="h-4" aria-hidden="true"></div>

      <!-- Subtle Divider -->
      <div class="h-[1px] w-full bg-[#E5E6EB]" role="separator"></div>

      <!-- Spacing: 12px after divider -->
      <div class="h-3" aria-hidden="true"></div>

      <!-- Sign Out Button (Danger-styled session action: #BA1A1A, transparent bg, subtle red hover) -->
      <button 
        type="button" 
        class="w-full flex items-center gap-3 px-3 min-h-[44px] rounded-[12px] bg-transparent text-[#BA1A1A] hover:bg-[#FFDAD6]/30 active:bg-[#FFDAD6]/50 transition-colors text-[15px] leading-[20px] font-medium text-left focus-ring"
        aria-label="Sign out of your account"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[#BA1A1A]" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="truncate">Sign out</span>
      </button>

    </div>
  </aside>

  <!-- Canvas presentation area: pure neutral workspace left blank intentionally -->
  <main class="flex-1 min-h-screen bg-[#F5F5F7] p-8 hidden md:block">
    <!-- Intentionally blank per specification -->
  </main>

</body>
</html>
