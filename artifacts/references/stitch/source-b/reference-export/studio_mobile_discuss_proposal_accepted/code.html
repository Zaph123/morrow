<style>

      html, body {

        margin: 0;
        padding: 0;

<body class="bg-[#F5F5F7] font-sans text-[#121316] antialiased min-h-screen flex flex-col justify-between">
<!-- Header & Segmented Control -->

</div>
<div class="flex items-center gap-3 shrink-0">

</div>
</div>
</div>

<div class="w-full border-b border-[#E5E6EB]"></div>

<div class="max-w-[390px] mx-auto px-4 pt-2 pb-3 w-full"><nav class="w-full h-8 p-0.5 bg-[#EBECEF] rounded-lg flex items-center gap-1" role="tablist"><a class="flex-1 h-7 flex items-center justify-center rounded-md text-[12px] font-medium text-[#5E636E] hover:text-[#121316] transition-colors" href="#">Write</a><a aria-current="page" class="flex-1 h-7 flex items-center justify-center gap-1.5 rounded-md bg-[#FFFFFF] border border-[#E5E6EB] text-[12px] font-medium text-[#121316]" href="#">Discuss</a></nav></div></header>
<!-- Main Scrollable Conversation Area -->
<main class="flex-1 w-full bg-[#F5F5F7] flex flex-col overflow-y-auto"><div class="flex-1 w-full max-w-[390px] mx-auto px-4 pb-4 flex flex-col pb-safe"><div class="bg-[#FFFFFF] border border-[#E5E6EB] rounded-2xl p-4 flex-1 flex flex-col justify-between"><div class="space-y-5"><div class="flex flex-col items-end w-full"><div class="bg-[#F5F5F7] border-0 text-[#121316] text-[15px] leading-relaxed rounded-2xl p-3.5 max-w-[90%]">Can we make the opening punchier? It feels a bit slow to get to the point.</div></div><div class="text-[15px] text-[#121316] leading-relaxed">Here’s an opening that leads with the contrast:</div><div class="flex items-center justify-between py-2 text-[14px]"><div class="flex items-center gap-2 text-[#121316] font-medium"><svg class="w-4 h-4 text-[#121316] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m4.5 12.75 6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Added to your draft</span></div><div class="flex items-center gap-3"><a class="text-[#5E636E] hover:text-[#121316] text-[13px] font-medium transition-colors" href="#">View in draft</a><button class="text-[#5E636E] hover:text-[#121316] text-[13px] font-medium transition-colors" type="button">Undo</button></div></div><div class="pt-1"><div class="text-[11px] font-semibold tracking-wider text-[#5E636E] uppercase mb-1 px-1">SUGGESTIONS</div><div class="divide-y divide-[#E5E6EB]"><button class="w-full py-2.5 px-1 flex items-center justify-between text-[#121316] hover:text-black transition-colors group text-left" type="button"><span class="text-[14px]">Tighten to fit one post</span><svg aria-hidden="true" class="w-4 h-4 text-[#8E94A0] group-hover:text-[#121316] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button class="w-full py-2.5 px-1 flex items-center justify-between text-[#121316] hover:text-black transition-colors group text-left" type="button"><span class="text-[14px]">Draft a LinkedIn version</span><svg aria-hidden="true" class="w-4 h-4 text-[#8E94A0] group-hover:text-[#121316] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></div></div><div class="mt-6 bg-[#FAFAFB] rounded-xl border border-[#E5E6EB] p-3 transition-colors"><div class="w-full min-h-[36px] flex items-center"><input aria-label="Ask about this draft" class="w-full bg-transparent text-[14px] text-[#121316] placeholder-[#5E636E] border-0 p-0 focus:ring-0 focus:outline-none" placeholder="Ask about this draft" type="text"/></div><div class="flex items-center justify-between gap-2 pt-2"><div class="flex items-center flex-wrap gap-1.5"><button class="h-7 px-2.5 rounded-full border border-[#E5E6EB] bg-[#FFFFFF] hover:bg-[#F5F5F7] text-[#121316] text-[12px] font-medium flex items-center transition-colors" type="button">Context · 2</button></div><button aria-label="Send inquiry" class="w-8 h-8 rounded-full bg-[#121316] text-[#FFFFFF] flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shrink-0 ml-auto" type="button"><svg aria-hidden="true" class="w-3.5 h-3.5 text-[#FFFFFF]" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24"><path d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></div></div></div></main>
