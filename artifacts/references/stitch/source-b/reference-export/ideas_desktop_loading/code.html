<script>
  // State management for responsive simulator and docked Discuss panel
  let currentMode = 'desktop';
  let isDiscussOpen = true;
  let isSidebarCollapsed = false;
  let activeMobileTab = 'write';

  function setViewportMode(mode) {
    currentMode = mode;
    const body = document.body;
    body.classList.remove('mode-desktop', 'mode-tablet', 'mode-mobile');
    body.classList.add(`mode-${mode}`);

    // Update switcher buttons UI
    const buttons = {
      desktop: document.getElementById('view-desktop-btn'),
      tablet: document.getElementById('view-tablet-btn'),
      mobile: document.getElementById('view-mobile-btn')
    };

    Object.keys(buttons).forEach(key => {
      if (key === mode) {
        buttons[key].className = 'px-2.5 py-1 rounded-md text-xs font-medium text-white bg-[#121316] shadow-sm transition-colors flex items-center gap-1.5';
      } else {
        buttons[key].className = 'px-2.5 py-1 rounded-md text-xs font-medium text-[#8E94A0] hover:text-white transition-colors flex items-center gap-1.5';
      }
    });

    const discussPanel = document.getElementById('right-discuss-panel');
    const writeView = document.getElementById('write-view-content');
    const mobileDiscussView = document.getElementById('mobile-discuss-view');

    if (mode === 'mobile') {
      discussPanel.style.display = 'none';
      if (activeMobileTab === 'write') {
        writeView.style.display = 'flex';
        mobileDiscussView.style.display = 'none';
      } else {
        writeView.style.display = 'none';
        mobileDiscussView.style.display = 'flex';
        renderMobileDiscussContent();
      }
    } else {
      writeView.style.display = 'flex';
      mobileDiscussView.style.display = 'none';
      discussPanel.style.display = isDiscussOpen ? 'flex' : 'none';
    }
  }

  function toggleDiscussPanel() {
    isDiscussOpen = !isDiscussOpen;
    const discussPanel = document.getElementById('right-discuss-panel');
    const discussBtn = document.getElementById('discuss-toggle-btn');
    
    if (isDiscussOpen) {
      discussPanel.style.display = 'flex';
      discussBtn.classList.remove('bg-white', 'text-[#5E636E]');
      discussBtn.classList.add('bg-[#EBECEF]', 'text-[#121316]');
    } else {
      discussPanel.style.display = 'none';
      discussBtn.classList.remove('bg-[#EBECEF]');
      discussBtn.classList.add('bg-white', 'text-[#5E636E]');
    }
  }

  function toggleSidebarCollapse() {
    isSidebarCollapsed = !isSidebarCollapsed;
    const sidebar = document.getElementById('sidebar-nav');
    if (isSidebarCollapsed) {
      sidebar.classList.add('!w-16');
      sidebar.querySelectorAll('.nav-label, .new-idea-text, .avatar-name').forEach(el => el.classList.add('hidden'));
    } else {
      sidebar.classList.remove('!w-16');
      sidebar.querySelectorAll('.nav-label, .new-idea-text, .avatar-name').forEach(el => el.classList.remove('hidden'));
    }
  }

  function setMobileTab(tab) {
    activeMobileTab = tab;
    const writeBtn = document.getElementById('mobile-tab-write');
    const discussBtn = document.getElementById('mobile-tab-discuss');
    const writeView = document.getElementById('write-view-content');
    const mobileDiscussView = document.getElementById('mobile-discuss-view');

    if (tab === 'write') {
      writeBtn.className = 'py-1.5 rounded-md text-[#121316] bg-white font-semibold shadow-xs transition-all flex items-center justify-center gap-1.5';
      discussBtn.className = 'py-1.5 rounded-md text-[#5E636E] hover:text-[#121316] transition-all flex items-center justify-center gap-1.5 relative';
      writeView.style.display = 'flex';
      mobileDiscussView.style.display = 'none';
    } else {
      discussBtn.className = 'py-1.5 rounded-md text-[#121316] bg-white font-semibold shadow-xs transition-all flex items-center justify-center gap-1.5 relative';
      writeBtn.className = 'py-1.5 rounded-md text-[#5E636E] hover:text-[#121316] transition-all flex items-center justify-center gap-1.5';
      writeView.style.display = 'none';
      mobileDiscussView.style.display = 'flex';
      renderMobileDiscussContent();
    }
  }

  function renderMobileDiscussContent() {
    const mobileContainer = document.getElementById('mobile-discuss-view');
    // Content cloned cleanly for seamless segmented toggle without modal or overlay
    mobileContainer.innerHTML = `
      <div class="flex-1 bg-white rounded-xl border border-[#E5E6EB] p-4 flex flex-col justify-between mb-4">
        <div class="space-y-4 overflow-y-auto mb-4">
          <div class="flex flex-col items-end">
            <div class="bg-[#F5F5F7] text-[#121316] text-xs rounded-xl px-3 py-2 max-w-[90%] leading-relaxed">
              Can we make the opening punchier? It feels a bit slow to get to the point.
            </div>
          </div>
          <div class="text-xs text-[#121316] leading-relaxed">
            Here's an alternative that cuts straight to the emotional hook without losing the vulnerability:
          </div>
          <section class="border border-dashed border-[#8E94A0] rounded-xl p-3 bg-[#FAFAFB]">
            <div class="text-[10px] font-medium tracking-wider text-[#5E636E] uppercase mb-1 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#8E94A0]"></span>
              <span>Proposed opening · not in draft</span>
            </div>
            <p class="text-xs text-[#121316] leading-relaxed mb-3">
              "Speed is easy to measure. Clarity usually isn't. Most tools are built to help you finish faster."
            </p>
            <div class="flex items-center gap-2">
              <button class="px-2.5 py-1 rounded-md border border-[#121316] bg-white text-xs font-medium text-[#121316]" type="button">
                Use as opening
              </button>
              <button class="text-xs font-medium text-[#5E636E]" type="button">
                Another take
              </button>
            </div>
          </section>
          <div>
            <div class="text-[10px] font-semibold tracking-wider text-[#5E636E] uppercase mb-1.5">Suggestions</div>
            <div class="divide-y divide-[#E5E6EB] text-xs">
              <button class="w-full py-2 flex items-center justify-between text-[#121316] text-left" type="button">
                <span>Tighten to fit one post</span>
                <span class="text-[#8E94A0]">›</span>
              </button>
              <button class="w-full py-2 flex items-center justify-between text-[#121316] text-left" type="button">
                <span>Draft a LinkedIn version</span>
                <span class="text-[#8E94A0]">›</span>
              </button>
            </div>
          </div>
        </div>
        <div class="border-t border-[#E5E6EB] pt-3">
          <div class="bg-[#F5F5F7] rounded-lg p-2 border border-[#E5E6EB]">
            <input class="w-full text-xs text-[#121316] placeholder-[#5E636E] border-0 p-0 focus:ring-0 focus:outline-none mb-2 bg-transparent" placeholder="Ask about this draft" type="text">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-medium text-[#5E636E] bg-white px-1.5 py-0.5 rounded border border-[#E5E6EB]">+ Add context</span>
              <button class="w-6 h-6 rounded-full bg-[#121316] text-white flex items-center justify-center text-xs">↑</button>
            </div>
          </div>
        </div>
      </div>
