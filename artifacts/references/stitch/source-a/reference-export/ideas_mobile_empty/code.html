<script>
  (function() {
    const tabAll = document.getElementById('tab-all');
    const tabUndeveloped = document.getElementById('tab-undeveloped');
    const rows = document.querySelectorAll('[data-developed]');

    function setFilter(showUndevelopedOnly) {
      if (showUndevelopedOnly) {
        tabUndeveloped.classList.remove('bg-transparent', 'text-[#5E636E]');
        tabUndeveloped.classList.add('bg-white', 'text-[#121316]');
        tabUndeveloped.setAttribute('aria-selected', 'true');

        tabAll.classList.remove('bg-white', 'text-[#121316]');
        tabAll.classList.add('bg-transparent', 'text-[#5E636E]');
        tabAll.setAttribute('aria-selected', 'false');

        rows.forEach(row => {
          if (row.getAttribute('data-developed') === 'false') {
            row.style.display = 'flex';
          } else {
            row.style.display = 'none';
          }
        });
      } else {
        tabAll.classList.remove('bg-transparent', 'text-[#5E636E]');
        tabAll.classList.add('bg-white', 'text-[#121316]');
        tabAll.setAttribute('aria-selected', 'true');

        tabUndeveloped.classList.remove('bg-white', 'text-[#121316]');
        tabUndeveloped.classList.add('bg-transparent', 'text-[#5E636E]');
        tabUndeveloped.setAttribute('aria-selected', 'false');

        rows.forEach(row => {
          row.style.display = 'flex';
        });
      }
    }

    if (tabAll && tabUndeveloped) {
      tabAll.addEventListener('click', () => setFilter(false));
      tabUndeveloped.addEventListener('click', () => setFilter(true));
    }
  })();
</script></main><nav class="fixed bottom-4 left-0 right-0 z-50 flex justify-center items-center pointer-events-none px-4"><div class="pointer-events-auto bg-[#121316] rounded-full p-1.5 flex items-center gap-1"><a aria-label="Home" class="flex items-center justify-center w-11 h-11 rounded-full text-[#D5D7DC] hover:text-[#FFFFFF] transition-colors active:scale-95" data-path="home" href="#"><span class="material-symbols-outlined text-[20px]">home</span></a><a aria-label="Studio" class="flex items-center justify-center w-11 h-11 rounded-full text-[#D5D7DC] hover:text-[#FFFFFF] transition-colors active:scale-95" data-path="studio" href="#"><span class="material-symbols-outlined text-[20px]">edit</span></a><a aria-label="Library" class="flex items-center justify-center w-11 h-11 rounded-full text-[#D5D7DC] hover:text-[#FFFFFF] transition-colors active:scale-95" data-path="library" href="#"><span class="material-symbols-outlined text-[20px]">menu_book</span></a><a aria-label="Ideas" class="flex items-center gap-1.5 px-3.5 h-11 rounded-full bg-[#2F3132] text-white font-medium text-[13px] transition-colors active:scale-95" data-path="ideas" href="#"><span class="material-symbols-outlined text-[20px]">lightbulb</span><span>Ideas</span></a><a aria-label="Brand Brain" class="flex items-center justify-center w-11 h-11 rounded-full text-[#D5D7DC] hover:text-[#FFFFFF] transition-colors active:scale-95" data-path="brand-brain" href="#"><span class="material-symbols-outlined text-[20px]">psychology</span></a></div></nav>
