<textarea class="h-28 w-full p-3.5 bg-white border border-[#E5E6EB] rounded-xl text-[16px] text-[#121316] placeholder-[#5E636E] placeholder:text-[16px] resize-none focus:outline-none focus:ring-1 focus:ring-[#536600] focus:border-[#536600] transition-colors" id="audience-input" name="audience" placeholder="Describe your audience and what you want your writing to achieve." rows="4"></textarea>
