<script>
(() => {
  const tabs = document.getElementById('brand-brain-tabs');
  if (!tabs) return;
  const revealActiveTab = () => {
    tabs.scrollLeft = tabs.scrollWidth - tabs.clientWidth;
  };
  const afterLayout = () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(revealActiveTab);
    });
  };
  document.fonts.ready.then(afterLayout);
  window.addEventListener('load', afterLayout, { once: true });
  window.addEventListener('resize', afterLayout);
})();
</script>
